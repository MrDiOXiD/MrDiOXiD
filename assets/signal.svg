<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" role="img"
    aria-label="Profile signal and language stack for MrDiOXiD">
    <defs>
        <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#0b625b" />
            <stop offset=".55" stop-color="#0c3b3d" />
            <stop offset="1" stop-color="#2d4f88" />
        </linearGradient>
        <style>.display{font:700 28px 'Trebuchet MS',sans-serif;fill:#dcfff7}.title{font:700 24px 'Trebuchet MS',sans-serif;fill:#dcfff7}.label{font:700 9px 'Trebuchet MS',sans-serif;fill:#43ead3;letter-spacing:1.6px}.body{font:12px 'Trebuchet MS',sans-serif;fill:#79aaa4}.mono{font:10px ui-monospace,Consolas,monospace;fill:#79aaa4}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.metric{font:700 34px 'Trebuchet MS',sans-serif}.language{font:700 12px 'Trebuchet MS',sans-serif;fill:#dcfff7}.percent{font:700 11px ui-monospace,Consolas,monospace}.bar{transform-origin:left;animation:grow .85s cubic-bezier(.32,.72,0,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
    </defs>
    
    <!-- Expanded main background height from 520 to 670 -->
    <rect width="900" height="670" rx="24" fill="#0b1d20" />
    
    <rect x="6" y="6" width="888" height="238" rx="20" fill="url(#shell)" stroke="#168f82" />
    <rect x="24" y="24" width="852" height="202" rx="18" fill="#0a2928" stroke="#1ca596" />
    <text x="42" y="61" class="title">Profile Signal</text>
    <text x="43" y="78" class="label">LIVE GITHUB STATS / @MRDIOXID</text>
    <g transform="translate(42 83)">
        <rect width="190" height="112" rx="18" fill="#0b2227" stroke="#1aa595" />
        <text x="22" y="30" class="label">STARS</text>
        <text x="22" y="70" class="metric" fill="#43ead3">
            <tspan fill="#43ead3">1</tspan>
        </text>
        <rect x="22" y="88" width="144" height="7" rx="4" fill="#203b40" />
        <rect x="22" y="88" width="18" height="7" rx="4" fill="#43ead3" class="bar"
            style="animation-delay:0.00s" />
    </g>
    <g transform="translate(253 83)">
        <rect width="190" height="112" rx="18" fill="#0b2227" stroke="#1aa595" />
        <text x="22" y="30" class="label">CONTRIBUTIONS</text>
        <text x="22" y="70" class="metric" fill="#9b6cff">
            <tspan fill="#9b6cff">74</tspan>
        </text>
        <rect x="22" y="88" width="144" height="7" rx="4" fill="#203b40" />
        <rect x="22" y="88" width="132" height="7" rx="4" fill="#9b6cff" class="bar"
            style="animation-delay:0.10s" />
    </g>
    <g transform="translate(464 83)">
        <rect width="190" height="112" rx="18" fill="#0b2227" stroke="#1aa595" />
        <text x="22" y="30" class="label">REPOSITORIES</text>
        <text x="22" y="70" class="metric" fill="#4387ff">
            <tspan fill="#4387ff">3</tspan>
        </text>
        <rect x="22" y="88" width="144" height="7" rx="4" fill="#203b40" />
        <rect x="22" y="88" width="26" height="7" rx="4" fill="#4387ff" class="bar"
            style="animation-delay:0.20s" />
    </g>
    <g transform="translate(675 83)">
        <rect width="190" height="112" rx="18" fill="#0b2227" stroke="#1aa595" />
        <text x="22" y="30" class="label">FOLLOWERS</text>
        <text x="22" y="70" class="metric" fill="#32d8ef">
            <tspan fill="#32d8ef">3</tspan>
        </text>
        <rect x="22" y="88" width="144" height="7" rx="4" fill="#203b40" />
        <rect x="22" y="88" width="26" height="7" rx="4" fill="#32d8ef" class="bar"
            style="animation-delay:0.30s" />
    </g>
    
    <!-- Box heights adjusted from 256/220 to 401/365 to fit all 7 items -->
    <rect x="6" y="258" width="888" height="401" rx="20" fill="url(#shell)" stroke="#168f82" />
    <rect x="24" y="276" width="852" height="365" rx="18" fill="#0a2928" stroke="#1ca596" />
    
    <text x="43" y="312" class="title">Language Stack</text>
    <text x="43" y="330" class="label">REPOSITORY-WEIGHTED TECHNOLOGIES</text>
    <text x="849" y="312" text-anchor="end" class="label">&gt; STACK.SCAN</text>

    <!-- JavaScript 80% -->
    <circle cx="62" cy="358" r="5" fill="#f2dc56" />
    <text x="82" y="362" class="language">JavaScript</text>
    <text x="285" y="362" text-anchor="end" class="percent" fill="#f2dc56">
        <tspan fill="#f2dc56">80%</tspan>
    </text>
    <rect x="315" y="350" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="350" width="408" height="9" rx="5" fill="#f2dc56" class="bar" style="animation-delay:0.15s" />

    <!-- TypeScript 75% -->
    <circle cx="62" cy="387" r="5" fill="#3178c6" />
    <text x="82" y="391" class="language">TypeScript</text>
    <text x="285" y="391" text-anchor="end" class="percent" fill="#3178c6">
        <tspan fill="#3178c6">75%</tspan>
    </text>
    <rect x="315" y="379" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="379" width="382" height="9" rx="5" fill="#3178c6" class="bar" style="animation-delay:0.23s" />

    <!-- Next.js 60% -->
    <circle cx="62" cy="416" r="5" fill="#ffffff" />
    <text x="82" y="420" class="language">Next.js</text>
    <text x="285" y="420" text-anchor="end" class="percent" fill="#ffffff">
        <tspan fill="#ffffff">60%</tspan>
    </text>
    <rect x="315" y="408" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="408" width="306" height="9" rx="5" fill="#ffffff" class="bar" style="animation-delay:0.31s" />

    <!-- NestJS 55% -->
    <circle cx="62" cy="445" r="5" fill="#ea2845" />
    <text x="82" y="449" class="language">NestJS</text>
    <text x="285" y="449" text-anchor="end" class="percent" fill="#ea2845">
        <tspan fill="#ea2845">55%</tspan>
    </text>
    <rect x="315" y="437" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="437" width="281" height="9" rx="5" fill="#ea2845" class="bar" style="animation-delay:0.39s" />

    <!-- React.js 60% -->
    <circle cx="62" cy="474" r="5" fill="#61dafb" />
    <text x="82" y="478" class="language">React.js</text>
    <text x="285" y="478" text-anchor="end" class="percent" fill="#61dafb">
        <tspan fill="#61dafb">60%</tspan>
    </text>
    <rect x="315" y="466" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="466" width="306" height="9" rx="5" fill="#61dafb" class="bar" style="animation-delay:0.47s" />

    <!-- English 90% -->
    <circle cx="62" cy="503" r="5" fill="#a855f7" />
    <text x="82" y="507" class="language">English</text>
    <text x="285" y="507" text-anchor="end" class="percent" fill="#a855f7">
        <tspan fill="#a855f7">90%</tspan>
    </text>
    <rect x="315" y="495" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="495" width="459" height="9" rx="5" fill="#a855f7" class="bar" style="animation-delay:0.55s" />

    <!-- French 40% -->
    <circle cx="62" cy="532" r="5" fill="#3b82f6" />
    <text x="82" y="536" class="language">French</text>
    <text x="285" y="536" text-anchor="end" class="percent" fill="#3b82f6">
        <tspan fill="#3b82f6">40%</tspan>
    </text>
    <rect x="315" y="524" width="510" height="9" rx="5" fill="#224043" />
    <rect x="315" y="524" width="204" height="9" rx="5" fill="#3b82f6" class="bar" style="animation-delay:0.63s" />

    <!-- Y-axis pushed down to 654 to clear the new items -->
    <text x="849" y="654" text-anchor="end" class="mono">Building products, agents and memorable
        digital experiences.D…</text>
</svg>
